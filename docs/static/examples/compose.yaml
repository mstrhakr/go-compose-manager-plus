services:
  app:
    # Planned normal-release tag; latest is not published yet.
    # For testing before the first release, replace latest with dev (Linux amd64).
    image: ghcr.io/mstrhakr/go-compose-manager-plus:latest
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_ADDR: ":8080"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-info}"
      APP_DATA_DIR: /data
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://127.0.0.1:${APP_PORT:-8080}}"
      APP_TRUSTED_PROXIES: "${APP_TRUSTED_PROXIES:-}"
      APP_DOCKER_SOCKET: "${APP_DOCKER_SOCKET:-}"
      APP_BOOTSTRAP_USERNAME: "${APP_BOOTSTRAP_USERNAME:-}"
      APP_BOOTSTRAP_PASSWORD: "${APP_BOOTSTRAP_PASSWORD:-}"
    volumes:
      - app-data:/data
      # Optional: mount a trusted project root for discovery.
      # - /absolute/host/projects:/projects:ro
      # Docker API access is effectively host-administrative, even with :ro.
      # Set APP_DOCKER_SOCKET and explicitly mount the socket only if trusted.
      # - /var/run/docker.sock:/var/run/docker.sock
    # If needed, add the host socket's numeric group ID:
    # group_add:
    #   - "REPLACE_WITH_SOCKET_GID"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  app-data:
