name: Set up Hugo
description: Install the checksum-verified extended Hugo binary on Linux amd64
runs:
  using: composite
  steps:
    - shell: bash
      env:
        HUGO_VERSION: "0.169.0"
        HUGO_SHA256: "c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d"
      run: |
        set -euo pipefail
        directory="$(mktemp -d "$RUNNER_TEMP/hugo.XXXXXX")"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
          --output "$directory/hugo.tar.gz"
        echo "$HUGO_SHA256  $directory/hugo.tar.gz" | sha256sum --check
        tar -xzf "$directory/hugo.tar.gz" -C "$directory" hugo
        echo "$directory" >> "$GITHUB_PATH"
